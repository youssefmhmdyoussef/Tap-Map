<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>Tap Tester</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&display=swap">
<style>
:root{--bg:#09090b;--panel:#141416;--panel2:#1c1c1f;--ink:#f4f4f5;--mute:#8e8e96;--line:rgba(255,255,255,.08);

--cf:linear-gradient(27deg,#17171a 5px,transparent 5px) 0 5px,linear-gradient(207deg,#17171a 5px,transparent 5px) 10px 0,linear-gradient(27deg,#2b2b30 5px,transparent 5px) 0 10px,linear-gradient(207deg,#2b2b30 5px,transparent 5px) 10px 5px,linear-gradient(90deg,#202024 10px,transparent 10px),linear-gradient(#222226 25%,#1b1b1e 25%,#1b1b1e 50%,transparent 50%,transparent 75%,#2e2e33 75%,#2e2e33);
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(120% 50% at 50% 0%,#1d1d22,transparent 65%) no-repeat,#09090b}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 4px}
h1{margin:0;display:flex;align-items:center;gap:10px;font:italic 700 25px/1 var(--num);letter-spacing:.03em}
h1::before{content:"";width:5px;height:20px;background:var(--acc);transform:skewX(-18deg);box-shadow:0 0 14px var(--glow)}
.sw{display:flex;gap:10px}
.sw button{min-height:0;width:22px;height:22px;padding:0;border-radius:50%;border:0;box-shadow:inset 0 1px 1px rgba(255,255,255,.35)}
.sw button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px #fff}
#cnt{font:600 16px/1 var(--num);color:var(--ink);padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
#pad{position:relative;height:36vh;margin:14px 16px 0;border-radius:22px;overflow:hidden;background:var(--cf);background-color:#0d0d0f;background-size:20px 20px;touch-action:none;user-select:none;-webkit-user-select:none;border:1px solid rgba(255,255,255,.1);box-shadow:0 16px 40px rgba(0,0,0,.55)}
#pad::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(90% 60% at 50% 125%,var(--glow),transparent 70%),radial-gradient(110% 70% at 50% -10%,rgba(255,255,255,.09),transparent 60%),linear-gradient(165deg,transparent 50%,rgba(0,0,0,.5))}
#hint{position:absolute;inset:0;z-index:2;display:grid;place-items:center;text-align:center;padding:24px;color:#b4b4bc;font-size:14px;pointer-events:none;text-shadow:0 1px 8px #000}
#pos{position:absolute;z-index:2;left:12px;bottom:10px;padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.55);color:var(--mute);font:600 14px/1.3 var(--num);letter-spacing:.03em;pointer-events:none}
#pos:empty{display:none}
.dot{position:absolute;z-index:2;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;display:grid;place-items:center;pointer-events:none;color:#fff;font:700 15px/1 var(--num);background:color-mix(in srgb,var(--acc) 30%,transparent);border:2px solid var(--acc);box-shadow:0 0 18px var(--glow),0 0 0 7px color-mix(in srgb,var(--acc) 12%,transparent);animation:f 1.6s forwards}
@keyframes f{to{opacity:0}}
#stats{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;margin:16px 16px 14px;border-radius:20px;overflow:hidden;background:var(--line);box-shadow:0 0 0 1px var(--line),0 12px 32px rgba(0,0,0,.4)}
.s{grid-column:span 2;display:flex;flex-direction:column-reverse;justify-content:flex-end;padding:12px;background:linear-gradient(180deg,var(--panel2),var(--panel))}
.s:nth-child(1){grid-column:1/-1;padding:16px 18px 18px;background:linear-gradient(100deg,var(--tint),transparent 65%),linear-gradient(180deg,var(--panel2),var(--panel))}
.s:nth-child(n+5){grid-column:span 3;padding:12px 14px}
.s b{font:700 24px/1.05 var(--num);letter-spacing:.01em;white-space:nowrap}
.s:nth-child(1) b{font-size:56px;color:var(--acc);text-shadow:0 0 26px var(--glow)}
.s span{margin-bottom:6px;font-size:12px;line-height:1.2;color:var(--mute);letter-spacing:.02em}
.bar{display:flex;gap:10px;padding:0 16px 16px}
button{font:600 15px system-ui,sans-serif;min-height:46px;padding:0 24px;border-radius:999px;color:var(--ink);border:1px solid var(--line);background:linear-gradient(180deg,#242428,#18181b);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
button.p{color:var(--on);border-color:transparent;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 85%,#fff),var(--acc));box-shadow:0 8px 22px -6px var(--glow),inset 0 1px 0 rgba(255,255,255,.3)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#ta{display:none;width:calc(100% - 32px);margin:0 16px 14px;height:120px;font:12px monospace;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.wrap{margin:0 16px 22px;overflow-x:auto;border-radius:20px;background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.4)}
table{border-collapse:collapse;width:100%;white-space:nowrap;font:600 16px/1.2 var(--num);font-variant-numeric:tabular-nums}
th,td{padding:10px 11px;text-align:right;border:0}
th{position:sticky;top:0;background:var(--panel);color:var(--mute);font:500 12px/1.2 system-ui,sans-serif;letter-spacing:.02em;box-shadow:0 1px 0 var(--line)}
tbody tr:nth-child(even) td{background:rgba(255,255,255,.025)}
tbody tr:first-child td{background:var(--tint)}
td:first-child{color:var(--mute)}
tbody tr:first-child td:first-child{color:var(--acc)}
.theme{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px 0}
.sw{gap:10px;flex-wrap:wrap}.sw button{width:24px;height:24px}
#swname{font:600 14px/1 var(--num);color:var(--mute);letter-spacing:.03em;white-space:nowrap}
#grip{display:flex;justify-content:center;align-items:center;height:30px;margin:2px 16px 0;touch-action:none}
#grip i{display:block;width:84px;height:6px;border-radius:99px;background:linear-gradient(180deg,#3a3a40,#26262a);box-shadow:0 0 0 1px var(--line)}
#grip.drag i{background:var(--acc);box-shadow:0 0 14px var(--glow)}
.bar{flex-wrap:wrap}.bar button{padding:0 18px}#fs{margin-left:auto}
#pad.pulse{animation:pp .28s ease-out}
@keyframes pp{from{border-color:var(--acc);box-shadow:0 16px 40px rgba(0,0,0,.55),0 0 22px var(--glow)}}
body.fs{overflow:hidden}
body.fs #pad{position:fixed;inset:0;z-index:50;height:auto!important;margin:0;border-radius:0;border:0}
body.fs .rs{display:none}
body.fs header,body.fs .theme,body.fs #grip,body.fs #stats,body.fs .bar,body.fs #ta,body.fs .wrap{display:none}
#hud{display:none;position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;width:min(280px,calc(100vw - 24px));border-radius:18px;overflow:hidden;background:rgba(14,14,16,.84);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 40px rgba(0,0,0,.6)}
body.fs #hud{display:block}
#hud .hh{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 14px;touch-action:none}
#hn{font:700 17px/1 var(--num);letter-spacing:.04em}
#hmin{min-height:0;width:30px;height:30px;padding:0;font-size:18px;line-height:1}
.hb{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.hb div{display:flex;flex-direction:column-reverse;padding:8px 14px;background:rgba(24,24,27,.92)}
.hb b{font:700 21px/1.1 var(--num);white-space:nowrap}.hb div:first-child b{color:var(--acc)}
.hb span{font-size:11px;color:var(--mute)}
.hbar{display:flex;gap:8px;padding:10px 10px 12px}
.hbar button{flex:1;min-height:38px;padding:0 4px;font-size:13px;white-space:nowrap}
#hud.min .hb,#hud.min .hbar{display:none}
#hud.min{width:auto;overflow:visible;border:0;border-radius:50%;background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
#hud.min .hh{padding:0}#hud.min #hn{display:none}
#hud.min #hmin{width:52px;height:52px;border:0;border-radius:50%;font:700 18px/1 var(--num);color:var(--on);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 85%,#fff),var(--acc));box-shadow:0 8px 22px -6px var(--glow),0 0 0 3px rgba(0,0,0,.45)}
#hint{align-content:center;row-gap:6px}.rs{color:var(--mute);font-size:13px}
button[hidden]{display:none}#inst{min-height:32px;padding:0 14px;font-size:13px}
</style>
</head>
<body>
<header><h1>Tap tester</h1><button id="inst" hidden>Install app</button><span id="cnt">0 taps</span></header>
<div class="theme"><div class="sw" id="sw"><button data-c="#ff2800" data-on="#fff" title="Ferrari red" aria-label="Ferrari red" style="background:#ff2800" class="on"></button><button data-c="#ff7a00" data-on="#111" title="Papaya orange" aria-label="Papaya orange" style="background:#ff7a00"></button><button data-c="#ffd400" data-on="#111" title="Lambo yellow" aria-label="Lambo yellow" style="background:#ffd400"></button><button data-c="#00ff41" data-on="#04130a" title="Matrix green" aria-label="Matrix green" style="background:#00ff41"></button><button data-c="#1e8bff" data-on="#fff" title="Sky blue" aria-label="Sky blue" style="background:#1e8bff"></button><button data-c="#2b4eff" data-on="#fff" title="Pepsi blue" aria-label="Pepsi blue" style="background:#2b4eff"></button><button data-c="#c8ccd2" data-on="#101114" title="Apple silver" aria-label="Apple silver" style="background:#c8ccd2"></button></div><span id="swname">Ferrari red</span></div>
<div id="pad"><div id="hint">Point your auto clicker at this area and start it. Every tap is logged.<br><span class="rs">Drag the bar below to resize.</span></div><div id="pos"></div></div>
<div id="grip" role="separator" aria-label="Drag to resize tap area"><i></i></div>
<div id="stats"></div>
<div class="bar"><button class="p" id="copy">Copy CSV</button><button id="clear">Clear</button><button id="fs">Fullscreen</button></div>
<textarea id="ta" readonly></textarea>
<div class="wrap" style="max-height:38vh"><table><thead><tr><th>#</th><th>x</th><th>y</th><th>hold ms</th><th>interval ms</th><th>gap ms</th><th>moved px</th></tr></thead><tbody id="tb"></tbody></table></div>
<script>
var pad=document.getElementById('pad'),tb=document.getElementById('tb'),act={},rows=[],t0=null,pDown=null,pUp=null,n=0,q=false;
function mean(a){return a.length?a.reduce(function(s,v){return s+v},0)/a.length:0}

 var r=pad.getBoundingClientRect(),t={n:++n,x:Math.round(e.clientX-r.left),y:Math.round(e.clientY-r.top),down:e.timeStamp,mv:0,sx:e.clientX,sy:e.clientY};
 try{pad.setPointerCapture(e.pointerId)}catch(x){}act[e.pointerId]=t;dot(t)});

 if(t){t.mv=Math.max(t.mv,Math.hypot(e.clientX-t.sx,e.clientY-t.sy))}});

 if(t0==null)t0=t.down;

 pDown=t.down;pUp=e.timeStamp;rows.push(r);
 var tr=document.createElement('tr');tr.innerHTML='<td>'+r.n+'</td><td>'+r.x+'</td><td>'+r.y+'</td><td>'+f(r.hold)+'</td><td>'+f(r.iv)+'</td><td>'+f(r.gap)+'</td><td>'+f(r.mv,0)+'</td>';
 tb.insertBefore(tr,tb.firstChild);while(tb.children.length>100)tb.lastChild.remove();
 if(!q){q=true;requestAnimationFrame(stats)}}
pad.addEventListener('pointerup',function(e){end(e,'ok')});

function stats(){q=false;var iv=rows.map(function(r){return r.iv}).filter(function(v){return v!=null}),h=rows.map(function(r){return r.hold}),xs=rows.map(function(r){return r.x}),ys=rows.map(function(r){return r.y});
 var span=rows.length>1?(rows[rows.length-1].at-rows[0].at)/1000:0;
 var c=[['Avg interval',f(mean(iv))+' ms'],['Interval min / max',f(iv.length?Math.min.apply(null,iv):null,0)+' / '+f(iv.length?Math.max.apply(null,iv):null,0)],['Interval spread (sd)',f(sd(iv))+' ms'],
 ['Avg hold',f(mean(h))+' ms'],['Position spread x / y',f(sd(xs),1)+' / '+f(sd(ys),1)+' px'],['Taps per second',span>0?f((rows.length-1)/span,2):'–']];
 document.getElementById('stats').innerHTML=c.map(function(a){return '<div class="s"><b>'+a[1]+'</b><span>'+a[0]+'</span></div>'}).join('');
 document.getElementById('cnt').textContent=rows.length+' taps'}
function csv(){return 'n,x,y,time_ms,hold_ms,interval_ms,gap_ms,moved_px,status\n'+rows.map(function(r){return [r.n,r.x,r.y,r.at.toFixed(1),r.hold.toFixed(1),r.iv==null?'':r.iv.toFixed(1),r.gap==null?'':r.gap.toFixed(1),r.mv.toFixed(0),r.st].join(',')}).join('\n')}

 try{navigator.clipboard.writeText(s).catch(function(){})}catch(x){}try{document.execCommand('copy')}catch(x){}};

document.getElementById('sw').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var s=document.documentElement.style;s.setProperty('--acc',b.dataset.c);s.setProperty('--on',b.dataset.on);[].forEach.call(this.children,function(x){x.classList.toggle('on',x===b)})});

</script>
<div id="hud"><div class="hh"><span id="hn">0 taps</span><button id="hmin" aria-label="Collapse">–</button></div><div class="hb"><div><b id="h1">–</b><span>Avg interval</span></div><div><b id="h2">–</b><span>Last interval</span></div><div><b id="h3">–</b><span>Last hold</span></div><div><b id="h4">–</b><span>Last x / y</span></div></div><div class="hbar"><button id="hcsv">Copy CSV</button><button id="hclr">Clear</button><button id="hexit" class="p">Exit</button></div></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)},pad=$('pad'),hud=$('hud'),B=document.body,fsOn=false;

$('hn').textContent=n+' taps';if(hud.classList.contains('min'))$('hmin').textContent=n;$('h1').textContent=a?a.textContent:'–';
$('h2').textContent=r&&r.iv!=null?r.iv.toFixed(1)+' ms':'–';$('h3').textContent=r?r.hold.toFixed(1)+' ms':'–';$('h4').textContent=r?r.x+' / '+r.y:'–'}

try{if(on){var r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(function(){})}
else if(document.fullscreenElement){var q=document.exitFullscreen();if(q&&q.catch)q.catch(function(){})}}catch(x){}

try{navigator.clipboard.writeText(csv()).then(function(){m('Copied ✓')},fb)}catch(x){fb()}};
var hh=hud.querySelector('.hh'),hd=null,mv=0,tEx=0;

$('hmin').onclick=function(){if(Date.now()-tEx<500||hud.classList.contains('min'))return;setMin(true)};
hh.addEventListener('pointerdown',function(e){var m=hud.classList.contains('min');if(!m&&e.target.closest('button'))return;var r=hud.getBoundingClientRect();hd={x:e.clientX-r.left,y:e.clientY-r.top,sx:e.clientX,sy:e.clientY};mv=0;try{hh.setPointerCapture(e.pointerId)}catch(x){}});

<script>
(function(){
var $=function(i){return document.getElementById(i)},CH=500,saved=0,tm=null,ut=null,S=null,hud=$('hud');
try{S=window.localStorage}catch(e){S=null}
